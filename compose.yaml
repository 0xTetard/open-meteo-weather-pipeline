services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weather
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: weather
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather -d weather"]
      interval: 5s
      timeout: 3s
      retries: 10

  pipeline:
    build: .
    profiles: ["run"]
    command:
      ["python", "-m", "weather_pipeline", "--database-url", "postgresql://weather:weather@db:5432/weather"]
    depends_on:
      db:
        condition: service_healthy

  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql://weather:weather@db:5432/weather
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
